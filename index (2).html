<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Haven</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:yellow;
}

/* Header */
header{
    background:#222;
    color:pink;
    padding:15px 0;
}

.navbar{
    width:90%;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.navbar h1{
    margin:0;
    color:white;
}

.navbar ul{
    list-style:none;
    display:flex;
    gap:20px;
}

.navbar ul li{
    cursor:pointer;
}

.navbar ul li:hover{
    color:#ffcc00;
}

/* Hero Section */
.hero{
    background:url('https://images.unsplash.com/photo-1512820790803-83ca734da794') center/cover no-repeat;
    height:350px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
}

.hero h2{
    font-size:40px;
    background:rgba(0,0,0,0.5);
    padding:15px 30px;
    border-radius:10px;
}

/* Book Section */
.books{
    width:90%;
    margin:40px auto;
}

.books h2{
    text-align:center;
    margin-bottom:30px;
}

.book-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:25px;
}

.book{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    text-align:center;
    transition:0.3s;
}

.book:hover{
    transform:translateY(-8px);
}

.book img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:8px;
}

.book h3{
    margin:10px 0 5px;
}

.price{
    color:#27ae60;
    font-weight:bold;
}

button{
    margin-top:10px;
    padding:8px 15px;
    border:none;
    background:#ffcc00;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#e6b800;
}

/* Form Section */
.form-section{
    width:300px;
    margin:40px auto;
    background:pink;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.form-section input{
    width:100%;
    padding:8px;
    margin:10px 0;
    color:brown;
}

/* Footer */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:40px;
}
</style>

<!-- Internal JavaScript -->
<script>
function checkForm(form)
{
    if(form.username.value == "") 
    {
      alert("Error: Username cannot be blank!");
      form.username.focus();
      return false;
    }

    re = /[^&#*]/;
    if(!re.test(form.username.value)) {
      alert("Error: Username must contain only letters, numbers and underscores!");
      form.username.focus();
      return false;
    }

    if(form.pwd1.value != "" && form.pwd1.value == form.pwd2.value) 
    {
      if(form.pwd1.value.length < 6)
      {
        alert("Error: Password must contain at least six characters!");
        form.pwd1.focus();
        return false;
      }

      if(form.pwd1.value == form.username.value) {
        alert("Error: Password must be different from Username!");
        form.pwd1.focus();
        return false;
      }

      re = /[0-9]/;
      if(!re.test(form.pwd1.value)) 
      {
        alert("Error: password must contain at least one number (0-9)!");
        form.pwd1.focus();
        return false;
      }

      re = /[a-z]/;
      if(!re.test(form.pwd1.value)) 
      {
        alert("Error: password must contain at least one lowercase letter (a-z)!");
        form.pwd1.focus();
        return false;
      }

      re = /[A-Z]/;
      if(!re.test(form.pwd1.value)) 
      {
        alert("Error: password must contain at least one uppercase letter (A-Z)!");
        form.pwd1.focus();
        return false;
      }
    } 
    else 
    {
      alert("Error: Please check that you've entered and confirmed your password!");
      form.pwd1.focus();
      return false;
    }

    alert("You entered a valid password: " + form.pwd1.value);
    return true;
}
</script>

</head>

<body>

<header>
<div class="navbar">
<h1>📚 Book Haven</h1>
<ul>
<li>Home</li>
<li>Books</li>
<li>Categories</li>
<li>Contact</li>
</ul>
</div>
</header>

<section class="hero">
<h2>Discover Your Next Favorite Book</h2>
</section>

<section class="books">
<h2>Popular Books</h2>

<div class="book-container">

<div class="book">
<img src="https://covers.openlibrary.org/b/id/10523338-L.jpg">
<h3>The Great Gatsby</h3>
<p class="price">$10.99</p>
<button>Buy Now</button>
</div>

<div class="book">
<img src="https://covers.openlibrary.org/b/id/11153219-L.jpg">
<h3>Atomic Habits</h3>
<p class="price">$14.99</p>
<button>Buy Now</button>
</div>

<div class="book">
<img src="https://covers.openlibrary.org/b/id/10521270-L.jpg">
<h3>Rich Dad Poor Dad</h3>
<p class="price">$12.99</p>
<button>Buy Now</button>
</div>

<div class="book">
<img src="https://covers.openlibrary.org/b/id/10594752-L.jpg">
<h3>The Alchemist</h3>
<p class="price">$11.99</p>
<button>Buy Now</button>
</div>

</div>
</section>

<!-- Form Section -->
<div class="form-section">
<h3>Register</h3>
<form onsubmit="return checkForm(this);">
<input type="text" name="username" placeholder="Username">
<input type="password" name="pwd1" placeholder="Password">
<input type="password" name="pwd2" placeholder="Confirm Password">
<input type="submit" value="Submit">
</form>
</div>

<footer>
<p>© 2026 Book Haven | All Rights Reserved</p>
</footer>

</body>
</html>
